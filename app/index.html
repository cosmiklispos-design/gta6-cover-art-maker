<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Lights — Cover Maker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice Lights</h1>
    <p class="tagline">Turn your photo into a multi-panel sunset poster. Photos stay on your machine — nothing is uploaded.</p>

    <label>Layout
      <select id="layout"></select>
    </label>
    <label>Colour grade
      <select id="grade"></select>
    </label>
    <label>Export size
      <select id="size"></select>
    </label>

    <label>Caption
      <input id="caption" type="text" maxlength="40" value="Sunset Heist">
    </label>
    <label>Sub-caption
      <input id="subtitle" type="text" maxlength="48" value="Vice Lights · 2026">
    </label>

    <fieldset class="panels">
      <legend>Panels — click a panel, upload a photo or pick a sample, drag the preview to position it</legend>
      <div id="panel-list"></div>
    </fieldset>

    <div class="exports">
      <button id="export" type="button">Export PNG</button>
      <button type="button" data-export-size="square">1080×1080</button>
      <button type="button" data-export-size="portrait">1080×1350</button>
      <button type="button" data-export-size="landscape">1920×1080</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <section class="preview" aria-label="Live preview">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
    <p class="hint">Live preview — drag a panel to pan its photo, click a panel to select it.</p>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
